name: bot

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

concurrency:
  group: bot
  cancel-in-progress: false

permissions:
  contents: read
  actions: write

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      ADMIN_CHAT_ID: ${{ secrets.ADMIN_CHAT_ID }}
      TELEGRAM_CHANNEL: ${{ secrets.TELEGRAM_CHANNEL }}
      APPROVAL: "1"
      SILENT: "1"
      POLISH: "0"
      VK_TOKEN: ${{ secrets.VK_TOKEN }}
      VK_GROUP_ID: ${{ secrets.VK_GROUP_ID }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: sudo apt-get install -y fonts-dejavu-core
      - run: pip install -r requirements.txt

      - name: Restore state
        id: state
        uses: actions/cache/restore@v4
        with:
          path: |
            seen.json
            inbox
            pending
            awaiting.json
            last_news.txt
            offset.txt
          key: state-${{ github.run_id }}
          restore-keys: state-

      - run: python run_once.py

      - name: Save state
        if: always()
        uses: actions/cache/save@v4
        with:
          path: |
            seen.json
            inbox
            pending
            awaiting.json
            last_news.txt
            offset.txt
          key: state-${{ github.run_id }}

      - name: Start next run
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run bot.yml --ref main
